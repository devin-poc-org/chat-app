<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCA Chat - Oracle Code Assist</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .header-info {
            display: flex;
            gap: 20px;
            align-items: center;
            font-size: 14px;
        }

        .badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 12px;
        }

        .auth-section {
            text-align: center;
            padding: 60px 30px;
        }

        .auth-section h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .auth-section p {
            color: #666;
            margin-bottom: 30px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: white;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .message.assistant .message-avatar {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .message-content {
            max-width: 70%;
            padding: 15px 20px;
            border-radius: 18px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .input-container {
            padding: 20px 30px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 15px;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        #messageInput {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            resize: none;
            max-height: 150px;
            transition: border-color 0.2s;
        }

        #messageInput:focus {
            outline: none;
            border-color: #667eea;
        }

        #sendButton {
            padding: 15px 30px;
            white-space: nowrap;
        }

        #sendButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .typing-indicator {
            display: none;
            padding: 15px 20px;
            background: white;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            width: fit-content;
        }

        .typing-indicator.active {
            display: block;
        }

        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.7;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }

        .empty-state {
            text-align: center;
            padding: 60px 30px;
            color: #999;
        }

        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #666;
        }

        .empty-state p {
            font-size: 16px;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 768px) {
            .container {
                height: 100vh;
                border-radius: 0;
            }

            .message-content {
                max-width: 85%;
            }

            .header-info {
                flex-direction: column;
                gap: 8px;
                align-items: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 OCA Chat</h1>
            <div class="header-info">
                <span class="badge">{{ oca_mode|upper }}</span>
                <span class="badge">{{ model_id }}</span>
                {% if authenticated %}
                <div class="controls">
                    <button class="icon-btn" onclick="clearChat()" title="Clear Chat">🗑️</button>
                    <button class="icon-btn" onclick="logout()" title="Logout">🚪</button>
                </div>
                {% endif %}
            </div>
        </div>

        {% if not authenticated %}
        <div class="auth-section">
            <h2>Welcome to OCA Chat</h2>
            <p>Please authenticate with Oracle Code Assist to start chatting</p>
            <button class="btn" onclick="login()">Login with OCA</button>
        </div>
        {% else %}
        <div class="chat-container">
            <div class="messages" id="messages">
                <div class="empty-state">
                    <h3>👋 Hello!</h3>
                    <p>Start a conversation by typing a message below</p>
                </div>
            </div>
            <div class="input-container">
                <div class="input-wrapper">
                    <textarea 
                        id="messageInput" 
                        placeholder="Type your message here..."
                        rows="1"
                        onkeydown="handleKeyPress(event)"
                    ></textarea>
                </div>
                <button class="btn" id="sendButton" onclick="sendMessage()">Send</button>
            </div>
        </div>
        {% endif %}
    </div>

    <script>
        const conversationId = 'default';
        let isProcessing = false;

        async function login() {
            try {
                const response = await fetch('/api/auth/login');
                const data = await response.json();
                
                if (data.success) {
                    // Browser will be opened automatically by the server
                    // Start polling for authentication status
                    pollAuthStatus();
                } else {
                    alert('Failed to initiate login: ' + (data.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Login error:', error);
                alert('Failed to initiate login: ' + error.message);
            }
        }

        function pollAuthStatus() {
            const pollInterval = setInterval(async () => {
                try {
                    const response = await fetch('/api/auth/status');
                    const data = await response.json();
                    
                    if (data.authenticated) {
                        clearInterval(pollInterval);
                        // Reload the page to show authenticated state
                        window.location.reload();
                    }
                } catch (error) {
                    console.error('Error polling auth status:', error);
                }
            }, 500);
            
            // Stop polling after 2 minutes
            setTimeout(() => clearInterval(pollInterval), 120000);
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                fetch('/api/auth/logout', { method: 'POST' })
                    .then(() => window.location.reload());
            }
        }

        function clearChat() {
            if (confirm('Are you sure you want to clear the chat history?')) {
                fetch(`/api/conversations/${conversationId}`, { method: 'DELETE' })
                    .then(() => {
                        document.getElementById('messages').innerHTML = `
                            <div class="empty-state">
                                <h3>👋 Hello!</h3>
                                <p>Start a conversation by typing a message below</p>
                            </div>
                        `;
                    });
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function addMessage(role, content) {
            const messagesDiv = document.getElementById('messages');
            
            // Remove empty state if it exists
            const emptyState = messagesDiv.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = role === 'user' ? 'U' : 'AI';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            messagesDiv.appendChild(messageDiv);
            
            // Scroll to bottom
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            
            return contentDiv;
        }

        function showTypingIndicator() {
            const messagesDiv = document.getElementById('messages');
            const indicator = document.createElement('div');
            indicator.className = 'message assistant';
            indicator.id = 'typing-indicator';
            indicator.innerHTML = `
                <div class="message-avatar">AI</div>
                <div class="typing-indicator active">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            `;
            messagesDiv.appendChild(indicator);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function hideTypingIndicator() {
            const indicator = document.getElementById('typing-indicator');
            if (indicator) {
                indicator.remove();
            }
        }

        function addOpcRequestIdButton(messageDiv, opcRequestId) {
            const opcDiv = document.createElement('div');
            opcDiv.className = 'opc-request-id';
            opcDiv.style.cssText = 'margin-top: 8px; padding: 8px; background: #f5f5f5; border-radius: 4px; font-size: 12px; font-family: monospace;';
            
            const label = document.createElement('span');
            label.textContent = 'opc-request-id: ';
            label.style.color = '#666';
            
            const idSpan = document.createElement('span');
            idSpan.textContent = opcRequestId;
            idSpan.style.color = '#333';
            
            const copyBtn = document.createElement('button');
            copyBtn.textContent = 'Copy';
            copyBtn.style.cssText = 'margin-left: 8px; padding: 4px 8px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 11px;';
            copyBtn.onclick = () => {
                navigator.clipboard.writeText(opcRequestId).then(() => {
                    copyBtn.textContent = 'Copied!';
                    setTimeout(() => {
                        copyBtn.textContent = 'Copy';
                    }, 2000);
                });
            };
            
            opcDiv.appendChild(label);
            opcDiv.appendChild(idSpan);
            opcDiv.appendChild(copyBtn);
            messageDiv.appendChild(opcDiv);
        }

        async function sendMessage() {
            if (isProcessing) return;

            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;

            // Disable input
            isProcessing = true;
            input.disabled = true;
            document.getElementById('sendButton').disabled = true;

            // Add user message
            addMessage('user', message);
            input.value = '';

            // Show typing indicator
            showTypingIndicator();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: message,
                        conversation_id: conversationId
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to send message');
                }

                // Hide typing indicator
                hideTypingIndicator();

                // Create assistant message container
                let assistantContent = '';
                let opcRequestId = null;
                const contentDiv = addMessage('assistant', '');

                // Read stream
                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = JSON.parse(line.slice(6));
                            
                            if (data.type === 'opc_request_id') {
                                opcRequestId = data.opc_request_id;
                            } else if (data.type === 'content') {
                                assistantContent += data.content;
                                contentDiv.textContent = assistantContent;
                                // Scroll to bottom
                                const messagesDiv = document.getElementById('messages');
                                messagesDiv.scrollTop = messagesDiv.scrollHeight;
                            } else if (data.type === 'error') {
                                contentDiv.textContent = `Error: ${data.error}`;
                                contentDiv.style.color = 'red';
                            } else if (data.type === 'done') {
                                console.log('Usage:', data.usage);
                                if (opcRequestId || data.opc_request_id) {
                                    const finalOpcId = opcRequestId || data.opc_request_id;
                                    addOpcRequestIdButton(contentDiv.parentElement, finalOpcId);
                                }
                            }
                        }
                    }
                }

            } catch (error) {
                hideTypingIndicator();
                addMessage('assistant', `Error: ${error.message}`);
            } finally {
                // Re-enable input
                isProcessing = false;
                input.disabled = false;
                document.getElementById('sendButton').disabled = false;
                input.focus();
            }
        }

        // Auto-resize textarea
        const textarea = document.getElementById('messageInput');
        if (textarea) {
            textarea.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 150) + 'px';
            });
        }

        // Load conversation history on page load
        {% if authenticated %}
        window.addEventListener('load', async () => {
            try {
                const response = await fetch(`/api/conversations/${conversationId}`);
                const data = await response.json();
                
                if (data.messages && data.messages.length > 0) {
                    const messagesDiv = document.getElementById('messages');
                    messagesDiv.innerHTML = '';
                    
                    data.messages.forEach(msg => {
                        addMessage(msg.role, msg.content);
                    });
                }
            } catch (error) {
                console.error('Failed to load conversation history:', error);
            }
        });
        {% endif %}
    </script>
</body>
</html>
